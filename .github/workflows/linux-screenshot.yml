name: linux-screenshot

on:
  workflow_dispatch:
    inputs:
      commit_screenshots:
        description: "Commit captured PNGs to docs/screenshots/ (non-main branches only)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/capture-linux-screenshots.sh"
      - ".github/workflows/linux-screenshot.yml"
      - "assets/icons/**"
      - "cmd/rnparmor/**"
      - "cmd/seeddemo/**"
      - "docs/screenshots/**"

concurrency:
  group: linux-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
      - name: cache deps
        uses: actions/cache@v4
        with:
          path: out/deps
          key: ${{ runner.os }}-deps-v3-${{ hashFiles('deps/pins.json', 'scripts/build-librnp.sh') }}
          restore-keys: |
            ${{ runner.os }}-deps-v3-
      - name: packages
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3 zlib1g-dev libbz2-dev pkg-config patchelf xvfb openbox scrot xdotool wmctrl libgtk-3-0 libgl1-mesa-dri libegl1 libgles2 fonts-dejavu-core fonts-noto-cjk imagemagick
      - name: build pinned librnp
        run: bash scripts/build-librnp.sh
      - name: build rnparmor
        run: |
          set -Eeuo pipefail
          APP_VER=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          echo "app version ${APP_VER}"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.appVersion=${APP_VER}" -o out/rnparmor ./cmd/rnparmor
      - name: build seeddemo
        run: CGO_ENABLED=0 go build -trimpath -o out/seeddemo ./cmd/seeddemo
      - name: capture screenshots
        run: bash scripts/capture-linux-screenshots.sh --bin "$PWD/out/rnparmor" --lib "$PWD/out/lib/librnp.so" --out "$PWD/out/screenshots" --seeder "$PWD/out/seeddemo"
      - uses: actions/upload-artifact@v4
        with:
          name: rnparmor-linux-screenshots
          path: out/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: commit screenshots to feature branch
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.commit_screenshots == true) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${TARGET_BRANCH}" || "${TARGET_BRANCH}" == "main" ]]; then
            echo "Refusing to commit screenshots to main or empty branch: '${TARGET_BRANCH}'"
            exit 0
          fi
          shots=(
            rnparmor-linux-en.png
            rnparmor-linux-zh.png
            rnparmor-linux-ja.png
            rnparmor-linux-text-en.png
            rnparmor-linux-text-zh.png
            rnparmor-linux-file-en.png
            rnparmor-linux-file-zh.png
            rnparmor-linux-packet-en.png
            rnparmor-linux-packet-zh.png
            rnparmor-linux-about-en.png
            rnparmor-linux-about-zh.png
          )
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            missing=0
            for name in "${shots[@]}"; do
              if [[ ! -f "docs/screenshots/${name}" ]]; then
                missing=1
                break
              fi
            done
            if [[ "$missing" -eq 0 ]]; then
              echo "All 11 docs/screenshots/rnparmor-linux-*.png already exist; skipping auto-commit on pull_request."
              exit 0
            fi
          fi
          mkdir -p docs/screenshots
          for name in "${shots[@]}"; do
            cp "out/screenshots/${name}" "docs/screenshots/${name}"
          done
          if git diff --quiet -- docs/screenshots && [[ -z "$(git ls-files --others --exclude-standard -- docs/screenshots)" ]]; then
            echo "Screenshots unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "OpenBot"
          git config user.email "335604065+openbotgit[bot]@users.noreply.github.com"
          git add -- \
            docs/screenshots/rnparmor-linux-en.png \
            docs/screenshots/rnparmor-linux-zh.png \
            docs/screenshots/rnparmor-linux-ja.png \
            docs/screenshots/rnparmor-linux-text-en.png \
            docs/screenshots/rnparmor-linux-text-zh.png \
            docs/screenshots/rnparmor-linux-file-en.png \
            docs/screenshots/rnparmor-linux-file-zh.png \
            docs/screenshots/rnparmor-linux-packet-en.png \
            docs/screenshots/rnparmor-linux-packet-zh.png \
            docs/screenshots/rnparmor-linux-about-en.png \
            docs/screenshots/rnparmor-linux-about-zh.png
          git commit -m "docs(screenshots): capture Linux demo keyring scenes" \
            -m "Co-authored-by: OpenBot <335604065+openbotgit[bot]@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
